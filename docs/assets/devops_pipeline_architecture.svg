<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">GitHub repo pushes trigger GitHub Actions to build and push a Docker image to GHCR, then deploy over an SSH tunnel through a VPS to the k3s master node, which manages a worker node and feeds a Prometheus/Grafana monitoring stack.</desc>
